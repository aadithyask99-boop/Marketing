<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Agency | Marketing Agency</title>
  <meta name="description" content="Your marketing agency: creative, SEO, social, content and paid media.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Mulish:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="/" aria-label="Your Agency home">youragency</a>
    <button class="menu-btn" type="button" aria-expanded="false" aria-controls="menu" aria-label="Open menu">
      <span aria-hidden="true">+</span>
    </button>
  </header>

  <nav id="menu" class="menu" hidden>
    <a href="#services">Services</a>
    <a href="#work">Work</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
  </nav>

  <main>
    <section class="hero">
      <p class="hero-tag">Your tagline goes here,<br>same great team</p>

      <h1 class="hero-title">
        <span class="line">Your</span>
        <span class="line">
          <span class="rotator" data-words="Creative,SEO,Social,Content,Paid,Growth" aria-live="polite">
            <span class="rotator-word">Creative</span>
          </span>
        </span>
        <span class="line line-last">
          <span>Agency</span>
          <svg class="asterisk" viewBox="0 0 100 100" aria-hidden="true">
            <g fill="currentColor">
              <rect x="42" y="2" width="16" height="96" rx="3"/>
              <rect x="42" y="2" width="16" height="96" rx="3" transform="rotate(60 50 50)"/>
              <rect x="42" y="2" width="16" height="96" rx="3" transform="rotate(120 50 50)"/>
            </g>
          </svg>
          <a class="badge" href="#contact">
            <svg viewBox="0 0 200 200" aria-hidden="true">
              <g fill="currentColor">
                <circle cx="100" cy="100" r="62"/>
                <circle cx="100" cy="48" r="38"/>
                <circle cx="136.8" cy="63.2" r="38"/>
                <circle cx="152" cy="100" r="38"/>
                <circle cx="136.8" cy="136.8" r="38"/>
                <circle cx="100" cy="152" r="38"/>
                <circle cx="63.2" cy="136.8" r="38"/>
                <circle cx="48" cy="100" r="38"/>
                <circle cx="63.2" cy="63.2" r="38"/>
              </g>
            </svg>
            <span>Let's bond</span>
          </a>
        </span>
      </h1>
    </section>
  </main>

  <div class="cursor-dot" aria-hidden="true"></div>
  <script src="script.js"></script>
</body>
</html>
